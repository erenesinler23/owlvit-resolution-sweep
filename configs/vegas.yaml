dataset:
  name: spacenet2
  root: data/spacenet2
  cities:
  - AOI_2_Vegas
  image_glob: '*{city}/*/RGB-PanSharpen/*.tif'
  label_glob: '*{city}/*/geojson/buildings/*.geojson'
  scale_max:
    AOI_2_Vegas: 1500.0
  native_gsd_m: 0.3
  chip_px: 650
split:
  block_cell: 0.01
  dev_fraction: 0.3
  seed: 20261008
  n_dev: 150
  n_test: 300
sweep:
  levels_gsd_m:
  - 0.3
  - 0.45
  - 0.6
  - 0.9
  - 1.2
  - 1.8
  - 2.4
  - 3.6
  - 5.0
  - 10.0
  methods:
  - area
  - blur_resize
  upsample: cubic
  blur_sigma_factor: 0.5
detectors:
  colour:
    paper_fixed:
      red_min: 120
      rg_min: 25
      rb_min: 25
    dev_grid:
      red_min:
      - 100
      - 120
      - 140
      chroma_min:
      - 15
      - 25
      - 40
  prompts:
  - a reddish or ochre-colored building
  - a red or terracotta rooftop
  - a satellite image of a building
  - an aerial view of a building
  - a rooftop seen from above
  - a house
  owlvit:
    model_id: google/owlvit-base-patch32
    revision: cbc355fb364588351c5d51c7f74465e8e7ec6f72
  owlv2:
    model_id: google/owlv2-base-patch16-ensemble
    revision: null
evaluation:
  iou_thresholds:
  - 0.25
  - 0.5
  prompt_sets:
    paper_pair:
    - 0
    - 1
    generic_paper:
    - 2
    aerial_view:
    - 3
    rooftop:
    - 4
    house:
    - 5
    all_generic:
    - 2
    - 3
    - 4
    - 5
  score_thresholds:
  - 0.001
  - 0.002
  - 0.003
  - 0.005
  - 0.0075
  - 0.01
  - 0.02
  - 0.05
  - 0.1
  - 0.2
  max_size_m:
  - 15
  - 20
  - 30
  - 60
  - 195
  min_area_m2:
  - 0
bootstrap:
  n_boot: 2000
  seed: 1
  alpha: 0.05
